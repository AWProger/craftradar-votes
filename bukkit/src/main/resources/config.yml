# CraftRadarVotes — мост голосов Votifier -> CraftRadar
enabled: true
# Базовый адрес сайта; запрос уходит на {api_url}/api/vote_ingest.php
api_url: "https://craftradar.ru"
# Ключ и секрет — https://craftradar.ru/dashboard/voting.php (секрет показывается один раз)
key_id: ""
secret: ""
# Разрешить http:// (только для тестов; секрет не передаётся, но тело открыто)
allow_insecure_http: false
# Максимум событий в очереди на диске; при переполнении новые отбрасываются с предупреждением
max_queue_size: 5000
# debug | info | warn | error
log_level: info

# ---------------------------------------------------------------------------
# Локальные награды за голоса (не зависят от пересылки в CraftRadar).
# Сайт команд на сервер не шлёт: всё настраивается и выполняется только здесь.
# Команды берутся ТОЛЬКО отсюда и выполняются от имени консоли на главном потоке.
# {player} — единственная подстановка (команды, message, broadcast); любой другой
# {...} = ошибка конфигурации. Ник проверяется по ^[A-Za-z0-9_.]{1,16}$,
# иначе награда не выдаётся. Данные голоса (адрес, сервис) в команды не попадают.
# Неизвестный ключ или значение вне диапазона = вся секция rewards не запускается
# (CONFIG_INVALID); ошибки с путём видны в консоли и в /crvotes rewards status.
# Пересылка голосов на сайт при этом работает. При reload невалидного конфига
# остаётся предыдущий валидный набор.
# Один и тот же голос не награждается дважды (дедуп хранится на диске).
# Команды и деньги выдаются не более одного раза: если сервер упал посреди выдачи,
# действие помечается UNCERTAIN в журнале и НЕ повторяется. Ответ dispatchCommand
# «true» не гарантирует эффект стороннего плагина. Не начатые действия той же награды
# выдаются при следующем входе игрока. Предметы и сообщения — «хотя бы один раз»
# (после падения предмет может выдаться повторно). Дедуп хранится retention-days дней.
# Состояние: plugins/CraftRadarVotes/rewards-state.json; журнал: rewards.log
# Проверка: /crvotes rewards test <ник> (игрок онлайн; не трогает дедуп, серии, лимиты),
# /crvotes rewards reload, /crvotes rewards status
# ВАЖНО: если награды за тот же голос выдаёт VotingPlugin, SuperbVote и т.п. —
# оставьте enabled: false, иначе награды удвоятся (мост продолжит слать голоса на сайт).
# ---------------------------------------------------------------------------
rewards:
  enabled: false            # по умолчанию выключено
  dry-run: false            # true: только пишет в журнал «выдал бы», ничего не исполняет и не меняет состояние
  services: []              # имена сервисов голоса (без учёта регистра); пусто = любой сервис
  timezone: "UTC"           # IANA-зона (например Europe/Moscow): границы суток, серий и лимита
  daily-limit: 0            # макс. наград на игрока и сервис за сутки, 0..1000; 0 = без лимита
  duplicate-protection:
    enabled: true
    retention-days: 30      # сколько дней хранить ключи уже награждённых голосов
  offline-queue:            # игрок оффлайн: награда ждёт входа; выключено = голос пропускается (SKIPPED_OFFLINE)
    enabled: true
    max-per-player: 50      # переполнение и истечение пишутся в журнал
    expire-days: 7
  default:                  # выдаётся за каждый принятый голос
    commands: []            # до 20 команд, до 256 символов, без перевода строки и без «/» в начале
    #  - "eco give {player} 100"
    items: []               # amount 1..2304, material — имя Material (не legacy, не AIR)
    #  - {material: DIAMOND, amount: 3}
    money: 0                # 0..1e9 через Vault; нет Vault — действие FAILED, не «успех»
    message: "&aСпасибо за голос!"   # игроку (онлайн), цветовые коды &, до 256 символов; "" = нет
    broadcast: ""           # всем на сервере, можно {player}; "" = нет
  weighted-pool:            # дополнительно к default: на каждый голос выбирается ровно ОДНА запись по весу
    enabled: false
    entries: []             # до 50 записей, weight 1..1000000
    #  - {weight: 70, commands: ["crate key give {player} vote 1"], items: [], money: 0, message: ""}
    #  - {weight: 30, items: [{material: DIAMOND, amount: 3}]}
  streaks:                  # серии: подряд идущие календарные дни (в timezone) с принятым голосом
    enabled: false
    milestones: []          # до 50; days 1..3650; срабатывает при серии ровно days
    #  - {days: 7, repeat: false, commands: ["eco give {player} 1000"], message: "&6Неделя подряд!"}
    #  repeat: true — срабатывает при каждом кратном days (7, 14, 21...)
  logging:
    enabled: true           # rewards.log в папке плагина

# ---------------------------------------------------------------------------
# Скины CraftRadar на сервере без лицензии (нужен SkinsRestorer 15.x, иначе модуль спит).
# При входе игрока плагин асинхронно спрашивает CraftRadar скин по нику
# ({api_url}/api/v1/skins/player/<ник>) и ставит его через API SkinsRestorer
# (текстуру подписывает MineSkin силами самого SkinsRestorer, как «/skin url»).
# Скин, который игрок или админ выбрал сам (/skin ...), не трогается.
# Ник засчитывается, только если игрок подтвердил его в CraftRadar Launcher
# (один ник — один аккаунт CraftRadar). /crvotes status показывает состояние.
# ---------------------------------------------------------------------------
skins:
  enabled: false              # по умолчанию выключено
  api_url: "https://craftradar.ru"
  timeout_ms: 3000            # тайм-аут запроса к сайту, 500..10000
  cache_minutes: 10           # сколько помнить ответ по нику, 1..1440
